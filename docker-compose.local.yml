networks:
  home:
    name: home

services:
  db:
    container_name: ${DB_NAME}  
    image: postgres:15.1-alpine
    restart: always
    env_file:
    - .env
    ports:
    - ${DB_PORT}:${DB_PORT}
    volumes:
    - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${DB_PORT}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - home

  devices:
    container_name: devices
    image: devices-app
    restart: always
    build: 
      context: ./Devices
      dockerfile: Dockerfile
    env_file:
    - .env
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    networks:
    - home

  nginx:
    container_name: smart-home-proxy
    build: ./Nginx
    ports:
      - "80:80"
    volumes:
      - ./Nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - devices
    networks:
    - home

  broker:
    image: confluentinc/cp-kafka:latest
    container_name: broker
    ports:
    - 9092:9092
    env_file:
    - .env
    networks:
    - home

  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    container_name: schema-registry
    ports:
      - "8081:8081"
    env_file:
    - .env
    depends_on:
      - broker
    networks:
      - home

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    depends_on:
      - broker
    ports:
      - "9000:9000"
    env_file:
    - .env
    networks:
    - home

volumes:
  postgres:
    name: devices-db-data-local


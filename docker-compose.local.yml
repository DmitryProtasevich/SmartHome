networks:
  home:
    name: home

services:
  db:
    container_name: ${DB_NAME}  
    image: postgres:15.1-alpine
    restart: always
    env_file:
    - .env
    ports:
    - ${DB_PORT}:${DB_PORT}
    volumes:
    - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${DB_PORT}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - home

  devices:
    container_name: devices
    image: devices-app
    restart: always
    build: 
      context: ./Devices
      dockerfile: Dockerfile
    env_file:
    - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
    - home

  nginx:
    container_name: smart-home-proxy
    build: ./Proxy
    ports:
      - "80:80"
    environment:
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_DISCOVERY: ${KEYCLOAK_DISCOVERY}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI}
    depends_on:
      - devices
      - keycloak
    networks:
      - home


  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:latest
    restart: always
    command: start-dev
    env_file:
      - .env
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:${DB_PORT}/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME:  ${KC_HOSTNAME}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: "xforwarded"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8080/"]
        interval: 10s
        timeout: 5s
        retries: 5
    networks:
      - home

volumes:
  postgres:
    name: devices-db-data-local
